[project]
name = "yesup-agent-runtime"
version = "0.1.0"
description = "YesUP 数字人 / 语音智能体后端（Repository 3）"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115",
  "uvicorn[standard]>=0.35",
  "pydantic>=2.11",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
  "certifi>=2024.8.30",
  "websockets>=16.0",
  # 文本推理层（可插拔，见 docs/research/tech-stack-assessment.md §3）
  "pydantic-ai>=2.20",
  # 会话/锁
  "redis>=6.2,<7",
  # 会话索引 + 审计（Core 直插，不搞 ORM 关系）
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.18",
  # 可观测性
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
  "opentelemetry-instrumentation-asyncpg>=0.48b0",
  "opentelemetry-instrumentation-redis>=0.48b0",
  "opentelemetry-instrumentation-logging>=0.48b0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=1.0",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "fakeredis>=2.20",
  "aiosqlite>=0.20.0",
  "ruff>=0.12",
  "mypy>=1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# live：打真 staging 的只读测试；默认不跑，需 --run-live 且有 AGENT_CORE_ACTOR_TOKEN。
markers = [
  "live: 真链路（真 staging 只读）测试，无 token 自动 skip",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# These rules conflict with established validation and live-test conventions.
ignore = ["B017", "BLE001", "S110", "TRY004"]
